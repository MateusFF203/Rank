```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rank do Grupo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #26345c 0%, #0b1020 45%, #05070d 100%);

    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: min(1050px, 94%);
    margin: auto;
    padding: 40px 0;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 35px;
}

.title {
    font-size: clamp(38px, 6vw, 62px);
    font-weight: 900;
    color: #ffd700;

    text-shadow:
        0 0 15px rgba(255,215,0,.35);
}

.subtitle {
    margin-top: 8px;
    color: #aeb8d0;
    font-size: 23px;
}

/* RANKING */

#ranking {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.player {
    display: flex;
    align-items: center;

    min-height: 115px;

    padding: 17px 23px;

    background: rgba(21,27,46,.96);

    border: 1px solid #35405f;
    border-radius: 22px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

    transition: transform .2s;
}

.player:hover {
    transform: translateY(-3px);
}

/* POSIÇÃO */

.position {
    width: 65px;

    text-align: center;

    font-size: 32px;
    font-weight: 900;
}

/* AVATAR */

.avatar-box {
    width: 78px;
    height: 78px;

    margin-right: 20px;

    flex-shrink: 0;
}

.avatar {
    width: 78px;
    height: 78px;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid #526184;

    background: #303a58;
}

.initial {
    width: 78px;
    height: 78px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;
    font-weight: 900;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed);
}

/* INFORMAÇÕES */

.info {
    flex: 1;
    min-width: 0;
}

.name {
    font-size: 29px;
    font-weight: 900;
}

.level {
    margin-top: 7px;

    font-size: 19px;

    color: #b8c1d9;
}

/* PONTOS */

.points {
    min-width: 120px;
    text-align: right;
}

.xp {
    font-size: 30px;

    font-weight: 900;

    color: #ffd700;
}

.unit {
    margin-top: 3px;

    font-size: 13px;

    color: #8993ad;
}

/* TOP 3 */

.player:nth-child(1) {
    border-color: #ffd700;
}

.player:nth-child(2) {
    border-color: #c0c0c0;
}

.player:nth-child(3) {
    border-color: #cd7f32;
}

/* FOOTER */

.footer {
    margin-top: 30px;

    padding: 22px;

    text-align: center;

    background: rgba(17,23,42,.95);

    border-radius: 20px;

    color: #aab3c9;

    font-size: 18px;
}

.warning {
    margin-top: 8px;

    color: #ff7777;
}

/* MOBILE */

@media(max-width:650px) {

    .container {
        padding: 20px 0;
    }

    .player {
        padding: 13px;
        gap: 10px;
    }

    .position {
        width: 30px;
        font-size: 22px;
    }

    .avatar-box,
    .avatar,
    .initial {
        width: 58px;
        height: 58px;
    }

    .initial {
        font-size: 25px;
    }

    .avatar-box {
        margin-right: 5px;
    }

    .name {
        font-size: 20px;
    }

    .level {
        font-size: 14px;
    }

    .points {
        min-width: 60px;
    }

    .xp {
        font-size: 20px;
    }

    .unit {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">
            🏆 RANK DO GRUPO
        </div>

        <div class="subtitle">
            Sistema de Patentes
        </div>

    </div>


    <!-- O JAVASCRIPT VAI COLOCAR OS JOGADORES AQUI -->

    <div id="ranking"></div>


    <div class="footer">

        ⚡ 10 pontos perdidos = rebaixamento de nível

        <div class="warning">
            O ranking é atualizado conforme a pontuação.
        </div>

    </div>

</div>


<script>

/*
====================================================
DADOS DO RANKING
====================================================

Para alterar os pontos, altere somente "pontos".

Para colocar uma foto:
avatar: "https://site.com/foto.jpg"

Se deixar avatar vazio:
avatar: ""

o sistema mostra automaticamente
a primeira letra do nome.
*/

const jogadores = [

    {
        nome: "Davi",
        pontos: 1000,
        avatar: "",
        patente: "👑 CHEFE"
    },

    {
        nome: "Mateus",
        pontos: 100,
        avatar: "",
        patente: "💪 CAPANGA"
    },

    {
        nome: "Marlon",
        pontos: 100,
        avatar: "",
        patente: "💪 CAPANGA"
    },

    {
        nome: "Nicoly",
        pontos: 10,
        avatar: "",
        patente: "⭐ BETINHA SUPREMO"
    },

    {
        nome: "Analice",
        pontos: 10,
        avatar: "",
        patente: "⭐ BETINHA SUPREMO"
    },

    {
        nome: "Ryan",
        pontos: 10,
        avatar: "",
        patente: "⭐ BETINHA SUPREMO"
    },

    {
        nome: "Felipe",
        pontos: 10,
        avatar: "",
        patente: "⭐ BETINHA SUPREMO"
    },

    {
        nome: "Armin",
        pontos: 10,
        avatar: "",
        patente: "⭐ BETINHA SUPREMO"
    },

    {
        nome: "Daniel",
        pontos: 10,
        avatar: "",
        patente: "⭐ BETINHA SUPREMO"
    },

    {
        nome: "Julia",
        pontos: 10,
        avatar: "",
        patente: "⭐ BETINHA SUPREMO"
    }

];


/*
====================================================
ORDENAÇÃO
====================================================
*/

jogadores.sort((a, b) => b.pontos - a.pontos);


/*
====================================================
GERAR RANKING
====================================================
*/

const ranking = document.getElementById("ranking");


jogadores.forEach((jogador, index) => {

    const card = document.createElement("div");

    card.className = "player";


    /*
    POSIÇÃO
    */

    let posicao;

    if (index === 0) {
        posicao = "🥇";
    }
    else if (index === 1) {
        posicao = "🥈";
    }
    else if (index === 2) {
        posicao = "🥉";
    }
    else {
        posicao = index + 1;
    }


    /*
    AVATAR
    */

    const primeiraLetra =
        jogador.nome.charAt(0).toUpperCase();


    let avatarHTML;


    if (jogador.avatar) {

        avatarHTML = `
            <img
                class="avatar"
                src="${jogador.avatar}"
                alt="Avatar de ${jogador.nome}"
                onerror="this.style.display='none';
                this.nextElementSibling.style.display='flex';"
            >

            <div
                class="initial"
                style="display:none;"
            >
                ${primeiraLetra}
            </div>
        `;

    } else {

        avatarHTML = `
            <div class="initial">
                ${primeiraLetra}
            </div>
        `;

    }


    /*
    CARD
    */

    card.innerHTML = `

        <div class="position">
            ${posicao}
        </div>

        <div class="avatar-box">

            ${avatarHTML}

        </div>

        <div class="info">

            <div class="name">
                ${jogador.nome}
            </div>

            <div class="level">
                ${jogador.patente}
            </div>

        </div>

        <div class="points">

            <div class="xp">
                ${jogador.pontos}
            </div>

            <div class="unit">
                PONTOS
            </div>

        </div>

    `;


    ranking.appendChild(card);

});


</script>

</body>
</html>
```
